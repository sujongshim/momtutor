<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>엄마 영어 과외</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: 상단 헤더(지문·단어장·어법·학습 기록) + 한 열 본문. 지문 목록은 필터 칩 + 행 목록. */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --fg:#1C2230; --muted:#5E6779; --line:#DDE1E8; --soft:#EEF0F4;
  --accent:#2646C9; --accent-fg:#FFFFFF; --btn:#C8EBC0; --btn-fg:#17421A; --btn-line:#8FCB84;
  --hl-gram:#C9EFA0; --hl-vocab:#DFCBF8; --hl-pron:#BFE0FF; --hl-link:#FFF27A;
  --ink-gram:#2E6A0F; --ink-vocab:#5B2BA0; --ink-pron:#1F5FA8; --ink-link:#7A6200;
  --red:#D92B2B; --par:#1E9E4A;
  --serif:'Source Serif 4','Noto Serif KR',Georgia,serif;
  --sans:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151C; --surface:#1B202B; --fg:#E7EAF0; --muted:#9AA3B5; --line:#2D3442; --soft:#242A37;
  --accent:#8FA8FF; --accent-fg:#10142A; --btn:#3C6B3A; --btn-fg:#E6F8E0; --btn-line:#5E9A5A;
  --hl-gram:#3F6322; --hl-vocab:#4D3A7C; --hl-pron:#20507C; --hl-link:#6A5B12;
  --ink-gram:#A9E27A; --ink-vocab:#CDB4FF; --ink-pron:#8CC4FF; --ink-link:#FFE066;
  --red:#FF6B6B; --par:#5AD17F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151C; --surface:#1B202B; --fg:#E7EAF0; --muted:#9AA3B5; --line:#2D3442; --soft:#242A37;
  --accent:#8FA8FF; --accent-fg:#10142A; --btn:#3C6B3A; --btn-fg:#E6F8E0; --btn-line:#5E9A5A;
  --hl-gram:#3F6322; --hl-vocab:#4D3A7C; --hl-pron:#20507C; --hl-link:#6A5B12;
  --ink-gram:#A9E27A; --ink-vocab:#CDB4FF; --ink-pron:#8CC4FF; --ink-link:#FFE066;
  --red:#FF6B6B; --par:#5AD17F; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.65;padding-inline:16px;padding-block:0 56px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px}
.topin{max-width:820px;margin-inline:auto;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.top h1{font-size:1.2rem;margin:0;letter-spacing:-.01em}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.tab.on{background:var(--btn);color:var(--btn-fg);border-color:var(--btn-line);font-weight:700}
main{max-width:820px;margin-inline:auto;display:flex;flex-direction:column;gap:16px;padding-block:20px}
h2{font-size:1.1rem;margin:0}
.lead{margin:0;color:var(--muted);font-size:.92rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
label{font-weight:700;font-size:.9rem}
textarea,input[type=text],input[type=number],select{font-family:inherit;font-size:.95rem;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);min-width:0}
textarea{width:100%;min-height:140px;resize:vertical;font-family:var(--serif);font-size:1.02rem;line-height:1.6}
textarea:focus-visible,input:focus-visible,select:focus-visible,button:focus-visible,.pt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1 1 140px}
button{font-family:inherit;font-size:.9rem;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
button.primary{background:var(--btn);color:var(--btn-fg);border-color:var(--btn-line);font-weight:700}
button:disabled{opacity:.55;cursor:default}
.status{font-size:.85rem;color:var(--muted)}
.status.err{color:var(--red)}
.fl{display:flex;gap:10px;align-items:flex-start}
.fl b{font-size:.82rem;color:var(--muted);min-width:2.6rem;padding-top:7px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{padding:5px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:.85rem}
.pill.on{background:var(--btn);color:var(--btn-fg);border-color:var(--btn-line);font-weight:700}
.cnt{font-size:.9rem;color:var(--muted)}.cnt b{color:var(--fg);font-size:1.05rem}
.plist{display:flex;flex-direction:column}
.pr{display:grid;grid-template-columns:6.4rem minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:12px 4px;border-top:1px solid var(--line)}
.pr.ph{display:none;border-top:none;font-size:.8rem;color:var(--muted);font-weight:700;border-bottom:2px solid var(--fg);padding-block:8px}
.pr .no{font-weight:700;font-size:1.1rem}
.pr .src{font-weight:700;overflow-wrap:anywhere}
.pr .src small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;grid-column:2 / 3}
.qt{padding:1px 7px;border-radius:99px;background:var(--hl-pron);font-size:.72rem;font-weight:700;line-height:1.4;justify-self:start;width:fit-content;white-space:nowrap}
.stt{padding:1px 7px;border-radius:99px;border:1px solid var(--line);font-size:.7rem;line-height:1.4;color:var(--muted);justify-self:start;width:fit-content;white-space:nowrap}
.stt.on{border-color:var(--par);color:var(--par)}
.rec{font-size:.8rem;color:var(--muted)}
.pr button{grid-column:3;grid-row:1 / span 2}
@media (min-width:720px){
  .pr,.pr.ph{grid-template-columns:11rem 4rem 8rem 6rem minmax(0,1fr) 5.5rem}
  .pr.ph{display:grid}
  .meta{display:contents}
  .pr button{grid-column:auto;grid-row:auto}
}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.lb{font-family:var(--sans);font-size:.72rem;font-weight:700;line-height:1;padding:4px 8px;border-radius:4px;white-space:nowrap;color:var(--fg)}
.lb.g1{background:var(--hl-gram)}.lb.g2{background:var(--hl-vocab)}.lb.g3{background:var(--hl-pron)}.lb.g7{background:var(--hl-link)}

.lb.g0{background:var(--surface);border:1px solid var(--line);text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:2px;text-underline-offset:3px}
.lb.g4{background:var(--surface);border:1px solid var(--line);text-decoration:underline;text-decoration-color:var(--par);text-decoration-thickness:2px;text-underline-offset:3px}
.lb.g5{background:var(--surface);border:1.5px solid var(--par)}
.lb.g6{background:var(--soft)}
.tag{font-size:.78rem;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:2px 8px;align-self:flex-start}
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center}
.passage{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:26px 18px 20px}
.en{font-family:var(--serif);font-size:.83rem;line-height:2.03;margin:0;overflow-wrap:anywhere}
.en.sm{font-size:.71rem;line-height:1.47}
.en mark{color:var(--fg);position:relative;padding:1px 0;border-radius:2px;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.en mark.static{cursor:default}
.en mark.g1{background:linear-gradient(transparent 52%,var(--hl-gram) 52%,var(--hl-gram) 92%,transparent 92%)}
.en mark.g2{background:linear-gradient(transparent 52%,var(--hl-vocab) 52%,var(--hl-vocab) 92%,transparent 92%)}
.en mark.g3{background:linear-gradient(transparent 52%,var(--hl-pron) 52%,var(--hl-pron) 92%,transparent 92%)}
.en mark.g7{background:linear-gradient(transparent 52%,var(--hl-link) 52%,var(--hl-link) 92%,transparent 92%)}
.en mark.g0,.en mark.g6{background:none}
.en mark.g4{background:none;text-decoration:underline;text-decoration-color:var(--par);text-decoration-thickness:2px;text-underline-offset:5px}
.en mark.g5{background:none;border:1.5px solid var(--par);border-radius:2px;padding:0 3px}
.en mark:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.keyu{text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:2px;text-underline-offset:5px}
.nt{position:absolute;left:0;top:-1.3em;font-family:var(--sans);font-size:.64rem;font-weight:700;line-height:1;white-space:nowrap;pointer-events:none;text-decoration:none}
.nt.g1{color:var(--ink-gram)}.nt.g2{color:var(--ink-vocab)}.nt.g3{color:var(--ink-pron)}.nt.g7{color:var(--ink-link)}
.nt.g0{color:var(--red)}.nt.g4,.nt.g5{color:var(--par)}.nt.g6{color:var(--fg)}
.gap{position:relative;display:inline-block;width:0;height:0}
.gap .nt{left:0;top:auto;bottom:1.45rem;transform:translateX(-50%)}
.gap .nt::after{content:'▾';display:block;text-align:center;font-size:.7rem;line-height:.7}
.hide-lb .nt{display:none}
.ko{display:block;font-family:var(--sans);font-size:.85rem;line-height:1.6;color:var(--muted);margin:2px 0 8px;padding-left:10px;border-left:2px solid var(--line)}
.passage:not(.show-ko) .ko{display:none}
.pop{position:absolute;z-index:5;width:min(340px,calc(100% - 16px));background:var(--surface);color:var(--fg);border:1px solid var(--accent);border-radius:8px;padding:10px 12px;box-shadow:0 6px 18px rgba(0,0,0,.18);font-family:var(--sans);font-size:.9rem;line-height:1.6;display:flex;flex-direction:column;gap:6px}
.pop[hidden]{display:none}
.pop .ph{font-family:var(--serif);font-weight:600;overflow-wrap:anywhere}
.pop p{margin:0}
.wbl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.wbl li{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;padding:10px 0;border-top:1px solid var(--line);user-select:text}
.wbl li:first-child{border-top:none}
.wh{font-family:var(--serif);font-weight:600;font-size:1.05rem;overflow-wrap:anywhere;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.wh span.t{background:linear-gradient(transparent 52%,var(--hl-vocab) 52%,var(--hl-vocab) 92%,transparent 92%)}
.wm{font-size:.92rem;color:var(--ink-vocab);font-weight:500}
.ws{font-family:var(--serif);font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.ws b{color:var(--fg)}
.src2{font-family:var(--sans);font-size:.72rem;color:var(--muted);font-weight:400}
.dots{display:inline-flex;gap:3px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);display:block}.dots i.on{background:var(--par)}
.hide-mean .wm{visibility:hidden}
.hide-mean li{cursor:pointer}
.hide-mean li.peek .wm{visibility:visible}
.gc{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.gc .ex{font-size:.9rem;margin:0}
.gc .gx{text-decoration:underline;text-decoration-color:var(--par);text-decoration-thickness:2px;text-underline-offset:4px}
.sim{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:8px}
.qbox{display:flex;flex-direction:column;gap:14px}
.qstem{font-family:var(--serif);font-size:1.15rem;line-height:1.9;margin:0;overflow-wrap:anywhere}
.qstem.big{font-size:1.5rem;font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:11px 14px;font-size:.95rem;line-height:1.5}
.opt.ok{border-color:var(--par);background:var(--hl-gram)}
.opt.no{border-color:var(--red)}
.fb{padding:10px 12px;border-radius:8px;background:var(--soft);font-size:.9rem}
.fb.ok b{color:var(--par)}.fb.no b{color:var(--red)}
.prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;background:var(--accent)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat div{background:var(--soft);border-radius:8px;padding:10px 12px}
.stat b{display:block;font-size:1.3rem}
.gr{display:flex;flex-wrap:wrap;gap:8px}.gr button{flex:1 1 100px;padding:11px 10px;font-weight:700}
.gr button.no{border-color:var(--red);color:var(--red)}.gr button.okb{border-color:var(--par);color:var(--par)}
.star{border:none;background:none;font-size:1.05rem;padding:2px 6px;cursor:pointer;color:var(--muted)}.star.on{color:#E0A400}
.seg{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--line)}.seg i{display:block}
.seg i.n{background:var(--hl-pron)}.seg i.s{background:var(--hl-vocab)}.seg i.m{background:var(--par)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal em{font-style:normal;font-size:.75rem;color:var(--muted)}
.cal span{aspect-ratio:1;max-width:100%;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:.85rem}
.cal span.today{font-weight:700;background:var(--soft)}.cal span.done{border:2px solid var(--red)}
.foot{font-size:.8rem;color:var(--muted);margin:0}

.visit{font-size:.8rem;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 10px;background:var(--surface);white-space:nowrap}
.visit b{color:var(--fg)}
.cheer{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,14,24,.55)}
.cheer-box{background:var(--surface);color:var(--fg);border:1px solid var(--btn-line);border-radius:16px;padding:28px 22px 22px;max-width:360px;width:100%;text-align:center;box-shadow:0 12px 36px rgba(0,0,0,.3)}
.cheer-box .em{font-size:2.4rem;line-height:1}
.cheer-box p{margin:12px 0 4px;font-size:1.25rem;font-weight:700;line-height:1.6;word-break:keep-all}
.cheer-box small{display:block;color:var(--muted);margin-bottom:16px}
.cheer-box button{width:100%;padding:11px;font-size:1rem}
</style>
</head>
<body>
<header class="top"><div class="topin"><h1>엄마 영어 과외</h1><span class="visit" id="visit" aria-live="polite"></span><nav class="tabs" id="nav" aria-label="메뉴"></nav></div></header>
<main id="app"></main>
<script>
(function(){
  var EXAMPLE=[
   {text:`The science we learn in grade school is a collection of certainties about the natural world — the earth goes around the sun, DNA carries the information of an organism, and so on.`,
    translation:`초등학교에서 배우는 과학은 자연계에 대한 확실한 사실의 모음이다. 지구가 태양 주위를 돌고, DNA가 생물의 정보를 담고 있다는 것 등이다.`,
    points:[
     {label:`that 생략`,phrase:`science we learn`,at:`science`,type:`어법`,explanation:`science와 we 사이에 목적격 관계대명사(that/which) 생략. learn의 목적어가 선행사 science.`}]},
   {text:`Only when you start to learn the practice of science do you realize that each of these "facts" was hard won through a succession of logical inferences based upon many observations or experiments.`,
    translation:`과학의 실제 과정을 배우기 시작해야 비로소, 이 "사실"들 하나하나가 수많은 관찰이나 실험에 근거한 논리적 추론이 이어진 끝에 어렵게 얻어졌음을 깨닫게 된다.`,
    points:[
     {label:`Only 도치`,phrase:`Only when you start to learn the practice of science`,type:`어법`,group:`only-inv`,explanation:`only + 부사절이 문두로 나가 주절 도치(조동사 + S + V).`},
     {label:`do + S + 동사원형`,phrase:`do you realize`,type:`어법`,group:`only-inv`,explanation:`You realize → do you realize. 일반동사 앞에 do, 동사는 원형.`},
     {label:`these = 과학적 사실`,phrase:`these`,type:`대명사`,explanation:`these = 앞 문장의 과학적 사실들(지구가 태양 주위를 돎, DNA 등).`},
     {label:`수동`,phrase:`was hard won`,type:`어법`,explanation:`hard는 부사, won은 win의 p.p. 수동태, "힘들게 얻어졌다".`},
     {label:``,phrase:`a succession of`,type:`어휘`,entry:`a succession of ~`,meaning:`일련의 ~, 잇따른 ~`,explanation:`succession = 연속.`},
     {label:`후치 수식`,phrase:`based upon many observations or experiments`,type:`어법`,explanation:`과거분사구, inferences 후치 수식. (which are) 생략.`}]},
   {key:true,text:`The process of science is less about collecting pieces of knowledge than it is about reducing the uncertainties in what we know.`,
    translation:`과학의 과정은 지식 조각을 모으는 것이라기보다, 우리가 아는 것의 불확실성을 줄이는 것에 가깝다.`,
    points:[
     {label:``,phrase:`less about`,type:`어휘`,entry:`less about A than B`,meaning:`A라기보다 B`,explanation:`less about A than B = A라기보다 B. A: collecting ~, B: reducing ~. 강조점은 B.`},
     {label:``,phrase:`than`,type:`어휘`,nowb:true,explanation:`less about A than B의 than. than 뒤가 B.`},
     {label:`it = process`,phrase:`it`,ctx:`than it is`,type:`대명사`,explanation:`it = The process of science.`},
     {label:`관계대명사`,phrase:`what`,ctx:`what we know`,type:`관계사`,explanation:`what = the thing that. in의 목적어 명사절. 관계대명사 뒤는 불완전한 문장(know의 목적어 없음).`}]},
   {text:`Our uncertainties can be greater or lesser for any given piece of knowledge depending upon where we are in that process — today we are quite certain of how an apple will fall from a tree, but our understanding of the turbulent fluid flow remains a work in progress after more than a century of effort.`,
    translation:`우리의 불확실성은 그 과정의 어디에 있느냐에 따라 지식 하나하나마다 더 클 수도, 더 작을 수도 있다. 오늘날 우리는 사과가 나무에서 어떻게 떨어지는지는 꽤 확실히 알지만, 난류 유동에 대한 이해는 한 세기 넘는 노력 뒤에도 여전히 진행 중이다.`,
    points:[
     {label:`병렬`,phrase:`greater or lesser`,type:`병렬`,explanation:`greater와 lesser 병렬(둘 다 형용사).`},
     {label:`given 형용사`,phrase:`any given piece of knowledge`,type:`어법`,explanation:`given = 주어진, 어떤 특정한. 과거분사의 형용사 용법.`},
     {label:`분사구문`,phrase:`depending upon`,type:`어법`,explanation:`분사구문, ~에 따라. upon의 목적어는 where절.`},
     {label:`의문부사`,phrase:`where`,ctx:`where we are`,type:`관계사`,explanation:`where = 의문부사. upon의 목적어 명사절. 관계부사 뒤는 완전한 문장(we are in that process).`},
     {label:`의문부사`,phrase:`how`,ctx:`how an apple`,type:`관계사`,explanation:`how 의문사절, of의 목적어. 어순 how + S + V. 관계부사 뒤는 완전한 문장.`},
     {label:`역접`,phrase:`but`,type:`연결어`,explanation:`but = 역접. 앞 절과 대조(이미 아는 것 ↔ 아직 연구 중).`},
     {label:``,phrase:`more than a century of`,type:`어휘`,entry:`more than ~`,meaning:`~ 이상, ~가 넘는`,explanation:`more than + 수량.`}]}
  ];

  var EXAMPLE2=[
   {text:`For a species born in a time when resources were limited and dangers were great, our natural tendency to share and cooperate is complicated when resources are plenty and outside dangers are few.`,

    items.forEach(function(it){
      var row=rows[rows.length-1];
      if(row&&Math.abs(it.r.top-row.top)<10)row.items.push(it);else rows.push({top:it.r.top,items:[it]});
    });
    rows.forEach(function(row){
      row.items.sort(function(a,b){return a.r.left-b.r.left});
      var edge=-Infinity;
      row.items.forEach(function(it){
        var l=it.r.left,w=it.r.width;
        if(l<edge+4)l=edge+4;
        var maxL=pr.right-10-w;
        if(l>maxL)l=Math.max(maxL,pr.left+6);
        it.n.style.marginLeft=(l-it.r.left)+'px';
        edge=l+w;
      });
    });
  }

  function vocabItems(plist){
    var items=[],seen={};
    plist.forEach(function(p){(p.sentences||[]).forEach(function(s){(Array.isArray(s.points)?s.points:[]).forEach(function(pt){
      if(pt.type!=='어휘'||pt.nowb)return;
      var h=String(pt.entry||pt.phrase||''),k=h.toLowerCase();
      if(!h||seen[k])return;seen[k]=1;
      items.push({k:k,h:h,m:String(pt.meaning||pt.explanation||''),s:String(s.text||''),p:String(pt.phrase||''),pid:p.id,src:pname(p)});
    })})});
    return items;
  }
  function gramItems(plist){
    var items=[];
    plist.forEach(function(p){(p.sentences||[]).forEach(function(s){(Array.isArray(s.points)?s.points:[]).forEach(function(pt){
      if(!GRAMTYPES[pt.type])return;
      var gk=pt.group?String(pt.group):'';
      if(gk){
        var hit=null;items.forEach(function(it){if(it.gk===gk&&it.pid===p.id&&it.s===String(s.text||''))hit=it});
        if(hit){
          hit.pt.parts.push(pt);
          if(pt.explanation)hit.pt.explanation=(hit.pt.explanation?hit.pt.explanation+' / ':'')+pt.explanation;
          return;
        }
      }
      var m=pt;
      if(gk){m={};for(var kk in pt)m[kk]=pt[kk];m.parts=[pt]}
      items.push({k:p.id+'|'+pt.phrase+'|'+(pt.ctx||''),gk:gk,pt:m,s:String(s.text||''),pid:p.id,src:pname(p),label:cleanLabel(pt.label)});
    })})});
    return items;
  }

  function sentWithPhrase(sentence,phrase,tagName){
    var f=mk('span'),i=phrase?sentence.indexOf(phrase):-1;
    if(i<0){f.textContent=sentence;return f}
    f.appendChild(document.createTextNode(sentence.slice(0,i)));
    f.appendChild(mk(tagName||'b',null,phrase));
    f.appendChild(document.createTextNode(sentence.slice(i+phrase.length)));
    return f;
  }
  function markSentence(text,pt){
    if(pt.parts&&pt.parts.length>1){
      var p2=mk('p','en sm'),g2=grp(pt.type),sp=[];
      pt.parts.forEach(function(q){var j=findIdx(text,q);if(j>=0)sp.push({s:j,e:j+String(q.phrase).length})});
      sp.sort(function(a,b){return a.s-b.s});
      var cur=0;
      sp.forEach(function(x){if(x.s<cur)return;p2.appendChild(document.createTextNode(text.slice(cur,x.s)));p2.appendChild(mk('mark','static g'+g2,text.slice(x.s,x.e)));cur=x.e});
      p2.appendChild(document.createTextNode(text.slice(cur)));
      return p2;
    }
    var p=mk('p','en sm'),i=findIdx(text,pt),g=grp(pt.type);
    if(i<0){p.textContent=text;return p}
    var ph=String(pt.phrase);
    p.appendChild(document.createTextNode(text.slice(0,i)));
    p.appendChild(mk('mark','static g'+g,text.slice(i,i+ph.length)));
    p.appendChild(document.createTextNode(text.slice(i+ph.length)));
    return p;
  }

  /* ---------- 퀴즈 ---------- */
  function updateRec(kind,key,ok,pid){
    var st=load(),bucket=kind==='vocab'?st.v:st.g;
    var r=bucket[key]||(bucket[key]={box:0,ok:0,ng:0});
    if(ok){r.box=Math.min(3,r.box+1);r.ok++}else{r.box=0;r.ng++}
    r.last=Date.now();
    var p=st.p[pid]||(st.p[pid]={ok:0,ng:0});
    p.ok=p.ok||0;p.ng=p.ng||0;if(ok)p.ok++;else p.ng++;
    save();
  }
  function pickQueue(kind,items,scope,n){
    var bucket=kind==='vocab'?load().v:load().g;
    var list=items.filter(function(it){
      var r=bucket[it.k];
      if(scope==='weak')return r&&r.ng>0&&r.box<2;
      if(scope==='new')return !r;
      return true;
    });
    list=list.map(function(it){var r=bucket[it.k];return {it:it,w:(!r?1:(r.box===0?0:r.box+1))+Math.random()*.9}})
      .sort(function(a,b){return a.w-b.w}).map(function(x){return x.it});
    return n>0?list.slice(0,n):list;
  }
  function startQuiz(kind,mode,items,scope,count){
    var q=pickQueue(kind,items,scope,parseInt(count,10)||0);
    if(!q.length){state.msg='조건에 맞는 항목이 없습니다. 범위를 바꿔 보세요.';render();return}
    state.msg='';
    state.quiz={kind:kind,mode:mode,pool:items,list:q,i:0,ok:0,wrong:[],done:false};
    render();
  }
  function buildQuestion(quiz,item){
    var stem=mk('div'),correct,pool,note=mk('div');
    if(quiz.kind==='vocab'&&quiz.mode==='meaning'){
      stem.appendChild(mk('p','qstem big',item.h));
      var s=mk('p','ws');s.appendChild(sentWithPhrase(item.s,item.p,'b'));stem.appendChild(s);
      correct=item.m;pool=quiz.pool.map(function(x){return x.m});
      note.textContent=item.h+' = '+item.m;
    }else if(quiz.kind==='vocab'){
      var q=mk('p','qstem'),i=item.s.indexOf(item.p);
      q.textContent=i>=0?item.s.slice(0,i)+'_______'+item.s.slice(i+item.p.length):item.s;
      stem.appendChild(q);stem.appendChild(mk('p','status','뜻: '+item.m));
      correct=item.h;pool=quiz.pool.map(function(x){return x.h});
      note.textContent=item.s;
    }else{
      stem.appendChild(mk('p','status','표시한 부분의 구문은?'));
      stem.appendChild(markSentence(item.s,item.pt));
      correct=item.label;pool=quiz.pool.map(function(x){return x.label});
      note.textContent=(item.label?item.label+' — ':'')+(item.pt.explanation||'');
    }
    var d=[];pool.forEach(function(v){if(v&&v!==correct&&d.indexOf(v)<0)d.push(v)});
    var opts=shuffle([correct].concat(shuffle(d).slice(0,3)));
    return {stem:stem,correct:correct,options:opts,note:note};
  }

  function buildPrompt(passage){
    return '너는 한국 고등학생에게 영어 구문을 가르치는 영어 교사다. 아래 영어 지문을 문장 단위로 나누어, 지문 위에 바로 표시할 해설을 만든다.\n\n'+
    '규칙:\n'+
    '- sentences 배열에는 지문의 모든 문장을 순서대로 넣는다. text는 원문을 한 글자도 바꾸지 않고 그대로 옮긴다.\n'+
    '- translation은 자연스러운 한국어 번역이다.\n'+
    '- points에는 표시할 부분만 문장당 0~6개 넣는다. 쉬운 것은 넣지 않는다. 표시 범위는 필요한 단어까지만 좁힌다.\n'+
    '- type은 다음 일곱 중 하나다. 어법: 생략(관계대명사·접속사 등), 도치, 비교, 분사구문·후치수식, to부정사·동명사, 수동태, 강조구문, 가정법, 동격 등. 어휘: 단어장에 모을 어렵거나 헷갈리는 핵심 단어와 표현(예: a succession of, tendency to). 쉬운 단어는 표시하지 않는다. 구 전체가 아니라 표현을 이루는 핵심 단어만 표시하고, less about A than B라면 less about과 than을 따로 표시한다. 대명사: 지시대상이 헷갈리기 쉬운 it, these, that, they 등. 대명사는 대명사 단어 하나만 phrase로 쓴다. 병렬: and, or로 이어진 같은 형태의 병렬 구조. 관계사: 관계대명사·관계부사·의문사(when, what, where, how 등)는 그 단어 하나만 phrase로 쓴다. 연결어: however, but, yet, because, if, for, when 등 절·문장을 이어 주는 말(linking words/phrases)로, label에는 역할(역접, 이유, 조건, 시간, 결과, 예시 등)을 쓴다. 보기: 문제의 번호(①~⑤)가 붙은 선택지 단어. 같은 단어가 문장에 여러 번 나오면 ctx에 그 단어가 들어 있는 더 긴 부분 문자열을 넣어 위치를 정한다.\n'+
    '- 문제의 정답이 되는 핵심 문장이 있으면 그 문장 객체에 "key": true를 넣는다. 문장이 너무 길면 key 대신 "keyPhrase"에 정답 근거가 되는 핵심 절을 원문 그대로 넣는다. 정답 근거는 한 문장(또는 한 절)만 고른다. 정답 문제를 알 수 없으면 글 전체의 핵심 주장 문장을 고른다.\n'+
    '- label은 지문 위에 쓸 12자 이내의 구문 이름이다. 예: "that 생략", "Only 도치", "분사구문". 어휘 항목은 label을 빈 문자열로 둔다(형광펜만 표시). 보기 항목은 label에 원문자 번호만 쓴다.\n'+
    '- 어휘와 보기 항목에는 meaning(한국어 뜻)을 넣는다. 단어장 표제어가 phrase와 다르면 entry에 쓴다. 예: phrase는 less about, entry는 less about A than B. 같은 표현의 나머지 조각이면 nowb를 true로 한다. 어법 설명이 필요한 표현(예: open to sharing)은 explanation에 어법을, meaning에 뜻을 쓴다. 전치사 to는 "to는 전치사, 뒤에 목적어(동명사)."처럼 쓴다.\n'+
    '- phrase는 해당 문장 text 안에 실제로 들어 있는 연속된 부분 문자열을 글자 그대로 복사한다. 서로 겹치지 않게 한다.\n'+
    '- 생략된 단어가 들어갈 자리를 정확히 표시해야 할 때는 at에 phrase 안에서 그 자리 바로 앞에 오는 부분 문자열을 넣는다. 예: phrase가 "science we learn"이고 that이 science 뒤에 생략된 경우 at는 "science", label은 "that 생략".\n'+
    '- explanation은 한국어로 한두 줄, 명사형·개조식으로 아주 간단히 쓴다. "~입니다", "~합니다" 같은 서술 어미를 쓰지 않는다. 예: "science와 we 사이에 목적격 관계대명사 생략.", "only + 부사절 문두 → 주절 도치(조동사 + S + V).", "less about A than B = A라기보다 B."\n'+
    '- 관계대명사(what, who, which, that)에는 "관계대명사 뒤는 불완전한 문장", 관계부사(when, where, why, how)에는 "관계부사 뒤는 완전한 문장"을 explanation에 덧붙인다.\n'+
    '- 확실하지 않은 해설은 만들지 않는다.\n\n'+
    '- group: 한 문장 안에서 하나의 문법이 두 곳 이상으로 떨어져 나타나면(예: Only 도치의 문두 부사절과 do you realize) 그 항목들에 같은 group 문자열을 넣는다. 아니면 빈 문자열이다.\n'+
    '출력은 JSON 하나만 낸다. 형식: {"sentences":[{"text":"...","translation":"...","key":false,"keyPhrase":"","points":[{"phrase":"...","label":"...","type":"어법","at":"","ctx":"","group":"","meaning":"","entry":"","nowb":false,"explanation":"..."}]}]}\n\n'+
    '지문:\n'+passage;
  }

  var INTERVALS=[1,3,7,14,30,60];
  function todayN(){return Math.floor((Date.now()+9*3600000)/86400000)}
  function vstatus(r){return !r?'새 단어':(r.st>=4?'외움':'공부 중')}
  function setOf(){var st=load();st.set=st.set||{};if(!st.set.newPerDay)st.set.newPerDay=10;return st.set}
  function speak(text){try{var u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.9;window.speechSynthesis.cancel();window.speechSynthesis.speak(u)}catch(e){}}
  function rate(item,grade){
    var st=load(),r=st.v[item.k]||(st.v[item.k]={st:0,ok:0,ng:0,seen:Date.now()});
    if(r.st==null)r.st=0;
    var d=todayN();
    if(grade==='know'){r.ok=(r.ok||0)+1;r.st=Math.min(6,r.st+1);r.due=d+INTERVALS[r.st-1]}
    else if(grade==='unsure'){r.ng=(r.ng||0)+1;r.st=0;r.due=d+1}
    else{r.ng=(r.ng||0)+1;r.st=0;r.due=d}
    r.last=Date.now();
    var p=st.p[item.pid]||(st.p[item.pid]={ok:0,ng:0});p.ok=p.ok||0;p.ng=p.ng||0;if(grade==='know')p.ok++;else p.ng++;
    st.days=st.days||{};st.days[d]=(st.days[d]||0)+1;
    save();
  }

        c.appendChild(h);c.appendChild(mk('div','wm',it.m));
        var ws=mk('div','ws');ws.appendChild(sentWithPhrase(it.s,it.p,'b'));c.appendChild(ws);
        list.appendChild(c);
      });
      if(!shown)list.appendChild(mk('p','status','조건에 맞는 단어가 없습니다.'));
    }
    qi.addEventListener('input',function(){state.vq=qi.value;fill()});
    fill();
  }
  function chipsInline(parent,values,cur,fn){
    var c=mk('div','chips');values.forEach(function(v){c.appendChild(btn(v,'pill'+(v===cur?' on':''),function(){fn(v)}))});parent.appendChild(c);
  }
  function vRecord(app,items){
    var st=load(),v=st.v,d=todayN(),days=st.days||{};
    var streak=0,k=days[d]?d:d-1;while(days[k]){streak++;k--}
    var cnt={n:0,s:0,m:0};
    items.forEach(function(x){var s=vstatus(v[x.k]);if(s==='새 단어')cnt.n++;else if(s==='외움')cnt.m++;else cnt.s++});
    var pn=mk('section','panel'),stt=mk('div','stat');
    stt.appendChild(tile('연속 일수',streak+'일'));stt.appendChild(tile('외운 단어',cnt.m));stt.appendChild(tile('공부 중',cnt.s));
    pn.appendChild(stt);
    var seg=mk('div','seg');
    [['n',cnt.n],['s',cnt.s],['m',cnt.m]].forEach(function(x){var i=mk('i',x[0]);i.style.width=(items.length?x[1]/items.length*100:0)+'%';seg.appendChild(i)});
    pn.appendChild(seg);
    pn.appendChild(mk('p','rec','새 단어 '+cnt.n+' · 공부 중 '+cnt.s+' · 외움 '+cnt.m));
    app.appendChild(pn);
    var cp=mk('section','panel'),now=new Date(Date.now()+9*3600000),y=now.getUTCFullYear(),m=now.getUTCMonth();
    cp.appendChild(mk('h2',null,(m+1)+'월'));
    var cal=mk('div','cal');
    ['일','월','화','수','목','금','토'].forEach(function(w){cal.appendChild(mk('em',null,w))});
    var first=new Date(Date.UTC(y,m,1)).getUTCDay(),len=new Date(Date.UTC(y,m+1,0)).getUTCDate();
    for(var i=0;i<first;i++)cal.appendChild(mk('span'));
    for(var day=1;day<=len;day++){
      var n=Date.UTC(y,m,day)/86400000,c=mk('span',(st.done&&st.done[n]?'done ':'')+(n===d?'today':''),String(day));cal.appendChild(c);
    }
    cp.appendChild(cal);cp.appendChild(mk('p','rec','오늘 복습을 끝내면 빨간 동그라미가 그려집니다.'));app.appendChild(cp);
    var sp=mk('section','panel');sp.appendChild(mk('h2',null,'하루 새 단어 수'));
    var sel=mk('select');sel.id='vs-new';[5,10,20,30].forEach(function(x){var o=mk('option',null,x+'개');o.value=String(x);if(setOf().newPerDay===x)o.selected=true;sel.appendChild(o)});
    sel.addEventListener('change',function(){setOf().newPerDay=parseInt(sel.value,10);save()});
    sp.appendChild(sel);app.appendChild(sp);
  }

  function viewSession(app){
    var s=state.vs,pn=mk('section','panel');
    if(s.i>=s.queue.length){
      if(!s.fin){
        s.fin=true;var st=load();
        if(s.isToday){st.done=st.done||{};st.done[todayN()]=1}
        st.log.push({t:Date.now(),k:'vocab',n:s.ok+s.ng,ok:s.ok});st.log=st.log.slice(-30);save();
      }
      pn.appendChild(mk('h2',null,'공부 끝'));
      var t=mk('div','stat');t.appendChild(tile('공부한 카드',s.ok+s.ng));t.appendChild(tile('알아요',s.ok));t.appendChild(tile('다시 볼 단어',s.ng));
      pn.appendChild(t);
      pn.appendChild(btn('끝내기','primary',function(){state.vs=null;render()}));
      app.appendChild(pn);return;
    }
    var item=s.queue[s.i];
    var top=mk('div','bar');
    top.appendChild(mk('span','cnt',(s.i+1)+' / '+s.queue.length));
    top.appendChild(btn('그만하기',null,function(){state.vs=null;render()}));
    pn.appendChild(top);
    var pg=mk('div','prog'),bar=mk('i');bar.style.width=(s.i/s.queue.length*100)+'%';pg.appendChild(bar);pn.appendChild(pg);
    function next(grade){
      rate(item,grade);
      if(grade==='know')s.ok++;else{s.ng++;if(grade==='dont'&&!item._rq){item._rq=1;s.queue.push(item)}}
      s.i++;s.flip=false;s.q=null;render();
    }
    if(s.mode==='card'){
      var box=mk('div','qbox'),hd=mk('div','row');
      hd.appendChild(mk('p','qstem big',item.h));
      var sp=mk('button','star','🔊');sp.type='button';sp.addEventListener('click',function(){speak(item.h)});hd.appendChild(sp);
      box.appendChild(hd);box.appendChild(mk('span','src2',item.src));
      if(!s.flip){
        box.appendChild(btn('뜻 보기','primary',function(){s.flip=true;render()}));
      }else{
        box.appendChild(mk('p','qstem',item.m));
        var ex=mk('p','ws');ex.appendChild(sentWithPhrase(item.s,item.p,'b'));box.appendChild(ex);
        var sp2=btn('🔊 예문 듣기',null,function(){speak(item.s)});box.appendChild(sp2);
        var gr=mk('div','gr');
        var b1=btn('모르겠어요','no',function(){next('dont')}),b2=btn('헷갈려요',null,function(){next('unsure')}),b3=btn('알아요','okb',function(){next('know')});
        gr.appendChild(b1);gr.appendChild(b2);gr.appendChild(b3);box.appendChild(gr);
      }
      pn.appendChild(box);
    }else{
      if(!s.q||s.qi!==s.i){s.q=buildQuestion({kind:'vocab',mode:'meaning',pool:s.pool},item);s.qi=s.i}
      var q=s.q,box2=mk('div','qbox');box2.appendChild(q.stem);
      var opts=mk('div','opts'),fb=mk('div'),nr=mk('div','row'),answered=false;
      q.options.forEach(function(o){
        var b=btn(o,'opt');
        b.addEventListener('click',function(){
          if(answered)return;answered=true;
          var ok=(o===q.correct);
          [].forEach.call(opts.children,function(x){if(x.textContent===q.correct)x.classList.add('ok')});
          if(!ok)b.classList.add('no');
          fb.className='fb '+(ok?'ok':'no');fb.appendChild(mk('b',null,ok?'정답입니다. ':'오답입니다. '));fb.appendChild(q.note);
          nr.appendChild(btn(s.i+1>=s.queue.length?'결과 보기':'다음 문제','primary',function(){next(ok?'know':'dont')}));
        });
        opts.appendChild(b);
      });
      box2.appendChild(opts);box2.appendChild(fb);box2.appendChild(nr);pn.appendChild(box2);
    }
    app.appendChild(pn);
  }

  /* ---------- 화면: 누적 어법 ---------- */
  function viewGram(app){
    if(state.quiz&&state.quiz.kind==='gram'){viewQuiz(app);return}
    var items=gramItems(allPassages());
    app.appendChild(mk('h2',null,'어법 복습'));
    app.appendChild(mk('p','lead','지문에서 표시한 어법, 관계사, 연결어, 대명사가 설명과 함께 모입니다.'));
    var qi=items.filter(function(x){return x.pt.type!=='대명사'&&x.label});
    if(qi.length>=3){
      app.appendChild(studyControls('gram',qi,function(row,get){
        row.appendChild(btn('구문 이름 고르기 학습','primary',function(){var g=get();startQuiz('gram','name',qi,g[0],g[1])}));
      }));
    }
    var fp=mk('section','panel');
    chips(fp,'종류',['전체','어법','관계사','연결어','대명사'],state.gType,function(v){state.gType=v;render()});
    app.appendChild(fp);
    var list=items.filter(function(x){return state.gType==='전체'||x.pt.type===state.gType});
    if(!list.length)app.appendChild(mk('p','status','표시된 항목이 없습니다.'));
    var rec=load().g;
    list.forEach(function(it){
      var c=mk('div','gc'),g=grp(it.pt.type);
      var h=mk('div','row');
      h.appendChild(mk('span','lb g'+g,NAMES[g]));
      if(it.label)h.appendChild(mk('b',null,it.label));
      h.appendChild(mk('span','src2',it.src));h.appendChild(dots(rec[it.k]));
      c.appendChild(h);
      c.appendChild(markSentence(it.s,it.pt));
      if(it.pt.explanation)c.appendChild(mk('p','ex gx',it.pt.explanation));
      if(it.pt.meaning)c.appendChild(mk('p','ex','뜻: '+it.pt.meaning));
      var sim=mk('div');
      if(simOf(it)){var r=mk('div','row');r.appendChild(btn('비슷한 예문 보기',null,function(){showSimilar(it,sim)}));c.appendChild(r)}
      c.appendChild(sim);app.appendChild(c);
    });
  }

  /* ---------- 화면: 학습 기록 ---------- */
  function viewRecord(app){
    var st=load();
    app.appendChild(mk('h2',null,'학습 기록'));
    app.appendChild(mk('p','lead','이 기기의 브라우저에만 저장됩니다.'));
    function sum(b){var ok=0,ng=0;Object.keys(b).forEach(function(k){ok+=b[k].ok||0;ng+=b[k].ng||0});return {ok:ok,ng:ng,n:ok+ng}}
    var v=sum(st.v),g=sum(st.g);
    var pn=mk('section','panel'),stat=mk('div','stat');
    [['단어 문제',v.n+'개 · '+(v.n?Math.round(v.ok/v.n*100):0)+'%'],['어법 문제',g.n+'개 · '+(g.n?Math.round(g.ok/g.n*100):0)+'%'],['학습 횟수',st.log.length+'회']].forEach(function(x){var d=mk('div');d.appendChild(mk('span',null,x[0]));d.appendChild(mk('b',null,x[1]));stat.appendChild(d)});
    pn.appendChild(stat);app.appendChild(pn);
    var all=allPassages(),vi=vocabItems(all),gi=gramItems(all);
    var weakV=vi.filter(function(x){var r=st.v[x.k];return r&&r.ng>r.ok});
    var weakG=gi.filter(function(x){var r=st.g[x.k];return r&&r.ng>r.ok&&x.label});
    var wp=mk('section','panel');wp.appendChild(mk('h2',null,'자주 틀리는 항목'));
    if(!weakV.length&&!weakG.length)wp.appendChild(mk('p','status','아직 없습니다.'));
    var ul=mk('ul','wbl');
    weakV.forEach(function(x){var li=mk('li');li.appendChild(mk('div','wh',x.h));li.appendChild(mk('div','wm',x.m));ul.appendChild(li)});
    weakG.forEach(function(x){var li=mk('li');li.appendChild(mk('div','wh',x.label));li.appendChild(mk('div','ws',x.pt.phrase));ul.appendChild(li)});
    wp.appendChild(ul);app.appendChild(wp);
    var lp=mk('section','panel');lp.appendChild(mk('h2',null,'최근 학습'));
    if(!st.log.length)lp.appendChild(mk('p','status','아직 없습니다.'));
    st.log.slice(-8).reverse().forEach(function(l){
      var d=new Date(l.t);
      lp.appendChild(mk('div','rec',(d.getMonth()+1)+'월 '+d.getDate()+'일 · '+(l.k==='vocab'?'단어':'어법')+' · '+l.ok+' / '+l.n));
    });
    app.appendChild(lp);
    var rs=btn('기록 지우기');
    rs.addEventListener('click',function(){
      if(rs.dataset.sure!=='1'){rs.dataset.sure='1';rs.textContent='정말 지울까요? 한 번 더 누르면 지워집니다.';return}
      mem={v:{},g:{},p:{},log:[]};save();render();
    });
    app.appendChild(rs);
  }

  /* ---------- 라우팅 ---------- */
  var TABS=[['list','지문'],['vocab','단어장'],['gram','어법 복습'],['record','학습 기록']];
  function go(v,pid){state.view=v;state.pid=pid||null;state.quiz=null;state.vs=null;state.msg='';closePop();render();try{window.scrollTo(0,0)}catch(e){}}
  function render(){
    var nav=document.getElementById('nav'),app=document.getElementById('app');
    nav.textContent='';
    TABS.forEach(function(t){
      var on=(state.view===t[0])||(t[0]==='list'&&state.view==='passage');
      var b=btn(t[1],'tab'+(on?' on':''),function(){go(t[0])});if(on)b.setAttribute('aria-current','page');nav.appendChild(b);
    });
    app.textContent='';pop=null;curPassage=null;
    if(state.view==='passage')viewPassage(app);
    else if(state.view==='vocab')viewVocab(app);
    else if(state.view==='gram')viewGram(app);
    else if(state.view==='record')viewRecord(app);
    else viewList(app);
  }
  render();

  /* ---------- 누적 방문 카운터 + 응원 팝업 ---------- */
  (function(){
    var n=1;
    try{n=(parseInt(localStorage.getItem('momtuto_visits'),10)||0)+1;localStorage.setItem('momtuto_visits',String(n))}catch(e){}
    var v=document.getElementById('visit');
    if(v){v.appendChild(document.createTextNode('누적 방문 '));v.appendChild(mk('b',null,n+'회'))}
    var ov=mk('div','cheer');ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');ov.setAttribute('aria-label','응원 메시지');
    var box=mk('div','cheer-box');
    box.appendChild(mk('div','em','💪'));
    box.appendChild(mk('p',null,'아들. 넌 할 수 있어! 오늘도 화이팅!'));
    box.appendChild(mk('small',null,'오늘도 '+n+'번째 시작이에요'));
    var ok=btn('시작하기','primary',function(){ov.remove()});
    box.appendChild(ok);ov.appendChild(box);document.body.appendChild(ov);
    ov.addEventListener('click',function(e){if(e.target===ov)ov.remove()});
    document.addEventListener('keydown',function(e){if(e.key==='Escape')ov.remove()});
    try{ok.focus()}catch(e){}
  })();

  /* ---------- 공유 저장소(지문 누적) ---------- */
  (async function(){
    try{state.db=await claude.use('db')}catch(e){}
    try{state.user=await claude.use('user')}catch(e){}
    if(state.user){try{state.canWrite=!!(await state.user.canEdit())}catch(e){}}
    if(!state.db)return;
    try{
      state.db.collection('passages').onSnapshot(function(snap){
        var arr=[];
        snap.docs.forEach(function(d){
          var x=d.data();if(!x)return;
          try{var s=JSON.parse(x.json);if(Array.isArray(s))arr.push({id:d.id,book:String(x.book||'1회'),no:Number(x.no)||0,qtype:String(x.qtype||''),origin:String(x.origin||''),sentences:s})}catch(e){}
        });
        state.dbList=arr;
        if(!state.quiz&&!state.vs&&state.view!=='passage'&&!state.showAdd)render();
      },function(){});
    }catch(e){}
  })();

})();
</script>
